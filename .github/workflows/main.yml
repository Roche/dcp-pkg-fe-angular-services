name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # Required to mint the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 1: Build with Node 22 (compatible with Angular 17)
      - name: Setup Node.js (Build Environment)
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # Step 2: Switch to Node 24 + npm 11.5.1+ for Trusted Publishing OIDC
      - name: Setup Node.js (Publish Environment)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        working-directory: dist/open-dcp/angular-services
        run: npm publish --provenance --access public
