commit-message-incrementing: Enabled
increment: Patch

major-version-bump-message: '(?i)\b(breaking change|breaking|major)\b'
minor-version-bump-message: '(?i)^feat(\(.+\))?:|\b(feature|minor)\b'
patch-version-bump-message: '(?i)^(fix|chore|ci|docs)(\(.+\))?:|\b(patch)\b'

assembly-informational-format: '{Major}.{Minor}.{Patch}{PreReleaseTagWithDash}'

branches:
  main:
    regex: ^main$
    increment: Inherit
    track-merge-target: true
    track-merge-message: true
    tracks-release-branches: true
    is-release-branch: true
    label: ''
    source-branches: [stage, develop]
  stage:
    regex: ^stage$
    increment: Inherit
    label: beta
    source-branches: [develop]
  develop:
    regex: ^develop$
    increment: Inherit
    label: alpha
    source-branches: [main, feature, hotfix, release]
